# Railway Configuration
# This file configures how Railway builds and deploys your application

[build]
# Use Nixpacks for automatic Python detection
builder = "nixpacks"

[deploy]
# Start command - Railway sets PORT environment variable
# Use sh -c to expand ${PORT:-8000} with shell expansion
startCommand = "sh -c 'python -m uvicorn web.app:app --host 0.0.0.0 --port ${PORT:-8000}'"

# Health check configuration
# Use simple /health endpoint for faster response
healthcheckPath = "/health"
healthcheckTimeout = 30

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Resource limits (adjust based on your Railway plan)
[deploy.resources]
memory = 512  # MB - minimum for Python apps
cpu = 0.5     # CPU shares

# Environment variables (can be overridden in Railway dashboard)
[deploy.env]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
WORKERS = "1"
