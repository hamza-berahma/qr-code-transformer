[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
markers =
    unit: Unit tests (fast)
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    requires_ortools: Tests that require ortools library
